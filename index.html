<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Reconhecimento Facial VTRN</title>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<style>
  body{background:#ece7db; display:flex; flex-direction:column; align-items:center; font-family:sans-serif;}
  .stage{position:relative; width:640px; height:480px; background:#000; margin-top:20px;}
  #video, #overlay{position:absolute; inset:0; width:100%; height:100%;}
  .hidden{display:none!important;}
</style>
</head>
<body>

<div class="stage">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
  <div id="startCover" style="position:absolute; inset:0; z-index:10; background:rgba(0,0,0,0.8); color:#fff; display:flex; align-items:center; justify-content:center;">
    <button id="startBtn" style="padding:20px; cursor:pointer;">ATIVAR CÂMERA</button>
  </div>
</div>

<div style="margin-top:20px;">
  <button id="capA">GUARDAR PESSOA A</button>
  <button id="clearBtn">LIMPAR</button>
  <p id="status">Status: Aguardando A...</p>
</div>

<script>
(function(){
  const video = document.getElementById("video");
  const startBtn = document.getElementById("startBtn");
  const status = document.getElementById("status");
  
  let running = false, lastDescriptor = null;
  const refs = {A: null};
  let bloqueioDeEnvio = false;

  async function start(){
    await faceapi.nets.tinyFaceDetector.loadFromUri("https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model");
    await faceapi.nets.faceLandmark68Net.loadFromUri("https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model");
    await faceapi.nets.faceRecognitionNet.loadFromUri("https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model");
    
    const stream = await navigator.mediaDevices.getUserMedia({video: true});
    video.srcObject = stream;
    document.getElementById("startCover").classList.add("hidden");
    running = true;
    loop();
  }

  async function loop(){
    while(running){
      const res = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                          .withFaceLandmarks().withFaceDescriptor();
      if(res) {
        lastDescriptor = res.descriptor;
        updateDecision();
      }
      await new Promise(r => setTimeout(r, 200));
    }
  }

  function updateDecision(){
    if(!refs.A || !lastDescriptor) return;
    
    const dist = Math.sqrt(refs.A.reduce((s, a, i) => s + Math.pow(a - lastDescriptor[i], 2), 0));
    
    // DEBUG: Verifique isso no CONSOLE do navegador
    console.log("Distância atual:", dist.toFixed(3));
    
    if(dist < 0.8) { // Tolerância aumentada para 0.8
      status.textContent = "Status: Pessoa A Reconhecida! Distância: " + dist.toFixed(3);
      
      if(!bloqueioDeEnvio) {
        bloqueioDeEnvio = true;
        console.log("ENVIANDO COMANDO PARA O ESP32...");
        
        fetch("http://192.168.100.81/reconhecido")
          .then(res => console.log("ESP32 respondeu:", res.status))
          .catch(err => console.error("ERRO AO CONECTAR ESP32:", err));
        
        setTimeout(() => { bloqueioDeEnvio = false; }, 5000); 
      }
    } else {
      status.textContent = "Status: Reconhecendo... (Distância: " + dist.toFixed(3) + ")";
    }
  }

  startBtn.onclick = start;
  document.getElementById("capA").onclick = () => { refs.A = lastDescriptor; alert("Pessoa A guardada!"); status.textContent = "Status: Pessoa A pronta."; };
  document.getElementById("clearBtn").onclick = () => { refs.A = null; alert("Limpo!"); };
})();
</script>
</body>
</html>
