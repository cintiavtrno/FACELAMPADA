<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A máquina não vê seu rosto</title>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<style>
  :root{ --paper:#ece7db; --ink:#171513; --red:#b0291f; }
  body{background:var(--paper); color:var(--ink); font-family:sans-serif; padding:20px;}
  .stage{position:relative; width:640px; height:480px; background:#000;}
  #video, #overlay{position:absolute; inset:0; width:100%; height:100%;}
  .hidden{display:none!important;}
</style>
</head>
<body>

<div class="stage">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
  <div id="startCover" style="position:absolute; inset:0; z-index:10; background:rgba(0,0,0,0.8); color:#fff; display:flex; align-items:center; justify-content:center;">
    <button id="startBtn" style="padding:20px;">Ativar Câmera</button>
  </div>
</div>

<div style="margin-top:20px;">
  <button id="capA">Guardar Pessoa A</button>
  <button id="clearBtn">Limpar Referências</button>
  <p id="status">Aguardando...</p>
</div>

<script>
(function(){
  const video = document.getElementById("video");
  const overlay = document.getElementById("overlay");
  const octx = overlay.getContext("2d");
  
  let running = false, modelsReady = false, lastDescriptor = null;
  const refs = {A: null};
  
  // VARIAVEIS DA TRAVA (A "Anti-metralhadora")
  let ultimoReconhecido = null;
  let bloqueioDeEnvio = false;

  async function start(){
    await faceapi.nets.tinyFaceDetector.loadFromUri("https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model");
    await faceapi.nets.faceLandmark68Net.loadFromUri("https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model");
    await faceapi.nets.faceRecognitionNet.loadFromUri("https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model");
    
    const stream = await navigator.mediaDevices.getUserMedia({video: true});
    video.srcObject = stream;
    document.getElementById("startCover").classList.add("hidden");
    running = true;
    loop();
  }

  async function loop(){
    while(running){
      const res = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                          .withFaceLandmarks().withFaceDescriptor();
      if(res) {
        lastDescriptor = res.descriptor;
        updateDecision();
      }
      await new Promise(r => setTimeout(r, 100));
    }
  }

  function updateDecision(){
    if(!refs.A || !lastDescriptor) return;
    
    const dist = Math.sqrt(refs.A.reduce((s, a, i) => s + Math.pow(a - lastDescriptor[i], 2), 0));
    
    // LOGICA DA TRAVA
    if(dist < 0.5) { // Limiar de precisão
      if(!bloqueioDeEnvio) {
        bloqueioDeEnvio = true; // Trava o envio
        
        console.log("Enviando comando para o ESP32...");
        // ENDEREÇO DO SEU ESP32
        fetch("http://192.168.100.81/reconhecido")
          .then(() => console.log("Comando enviado com sucesso!"))
          .catch(err => console.error("Erro ao conectar no ESP32:", err));
        
        // Libera após 5 segundos
        setTimeout(() => { bloqueioDeEnvio = false; }, 5000); 
      }
    }
  }

  document.getElementById("startBtn").onclick = start;
  document.getElementById("capA").onclick = () => { refs.A = lastDescriptor; alert("Pessoa A guardada!"); };
  document.getElementById("clearBtn").onclick = () => { refs.A = null; alert("Limpo!"); };
})();
</script>
</body>
</html>
